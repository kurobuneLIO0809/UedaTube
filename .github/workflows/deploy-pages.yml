# フロントエンドを GitHub Pages に公開します。
# 事前に Settings → Pages → Source を「GitHub Actions」にし、
# Settings → Secrets and variables → Actions → Variables に VITE_API_BASE_URL を登録してください。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: API接続先が設定されているか確認
        run: |
          if [ -z "${{ vars.VITE_API_BASE_URL }}" ]; then
            echo "::error::リポジトリの Variables に VITE_API_BASE_URL（Cloudflare Worker の URL）を登録してください。"
            exit 1
          fi
      - run: npm ci
        working-directory: frontend
      - name: ビルド
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SITE_NAME: ${{ vars.VITE_SITE_NAME }}
          VITE_CATEGORIES: ${{ vars.VITE_CATEGORIES }}
          # プロジェクトサイト（https://<user>.github.io/<repo>/）用のパス。
          # <user>.github.io リポジトリやカスタムドメインの場合は Variables で VITE_BASE_PATH=/ を設定
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || format('/{0}/', github.event.repository.name) }}
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
