# （任意）Cloudflare Worker を GitHub Actions からデプロイします。手動実行のみ。
# 使う場合は Settings → Secrets and variables → Actions → Secrets に
#   CLOUDFLARE_API_TOKEN（Workers・D1・R2 を編集できる API トークン）
#   CLOUDFLARE_ACCOUNT_ID
# を登録してください。合言葉などの Workers Secrets は wrangler secret put で別途登録します。
name: Deploy Worker (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        working-directory: worker
      - run: npm test
        working-directory: worker
      - name: D1 マイグレーション
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply school-nico-db --remote
      - name: デプロイ
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
